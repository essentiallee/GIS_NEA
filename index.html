<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>GIS Final / NYC Cultural Infrastructure</title>
  <meta name="description" content="NYC cultural organization locations in the GIS_Final Figma layout.">
  <!-- The course mapping structure stays in HTML + YAML. -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/site.css">
  <script type="importmap">
    { "imports": { "maplibre-gl": "https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.mjs" } }
  </script>
  <script type="module" src="https://unpkg.com/@maplibre-yaml/core@0.10/register.js"></script>
</head>
<body>
  <!-- Figma frame 1:2: two rounded panels and a source footer. -->
  <main class="page" data-node-id="1:2">
    <div class="workspace">
      <section class="panel map-panel" data-node-id="1:3"
               aria-label="Interactive NYC cultural organization map">
        <ml-map src="maps/nyc.yaml" class="project-map"></ml-map>
        <noscript><p class="fallback">Enable JavaScript to use the map.</p></noscript>
      </section>

      <section class="panel information-panel" data-node-id="1:7"
               aria-labelledby="project-title">
        <header class="panel-heading">
          <!-- Exact SVG exported from Figma, stored locally. -->
          <img class="title-circle" data-node-id="1:8"
               src="assets/figma-title-circle.svg" alt="">
          <!-- Replace Figma's placeholder with the actual project title. -->
          <h1 id="project-title" data-node-id="1:4">NYC Cultural Infrastructure</h1>
        </header>
      </section>
    </div>

    <footer class="sources" data-node-id="1:5">
      <a href="https://data.cityofnewyork.us/d/u35m-9t32">NYC DCLA, Oct 2026</a>
      <span aria-hidden="true"> / </span>
      <a href="https://www.nyc.gov/content/planning/pages/resources/datasets/census-tracts">NYC DCP, 2020 NTA geography</a>
      <span aria-hidden="true"> / </span>
      <a href="data/README.md">Data notes</a>
    </footer>
  </main>
</body>
</html>
