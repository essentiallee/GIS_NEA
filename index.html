<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Alliance Protocol: an interactive draft exploring NYC cultural funding, neighborhood geography, and collective resilience.">
  <title>ALLIANCE PROTOCOL</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <main class="workspace" aria-label="Alliance Protocol story map">
    <section class="panel map-panel" aria-label="Interactive map">
      <div id="map"></div>
      <div class="map-caption"><div class="chapter-switch"><button id="previous-chapter" type="button" aria-label="Previous chapter">&lt;</button><span id="map-label">01|08 Landscape</span><button id="next-chapter" type="button" aria-label="Go to next chapter">&gt;</button></div><button id="reset-view" type="button">Reset view</button></div>
      <p id="map-status" role="status">Loading the map…</p>
      <aside id="legend" aria-label="Legend for the current chapter" aria-live="polite"></aside>
      <div class="map-footer"><a href="data/README.md" target="_blank" rel="noopener">Sources &amp; data notes</a><span>Drag / zoom / click to explore</span></div>
    </section>
    <section class="panel narrative-panel" aria-labelledby="project-title">
      <header class="project-header">
        <h1 id="project-title">ALLIANCE PROTOCOL</h1>
        <p>Reimagining the Governance of Fund Distribution in the Arts</p>
      </header>
      <nav class="fixed-chapter-nav" aria-label="Chapter navigation"><div class="chapter-counter"><button id="previous-chapter-right" type="button" aria-label="Previous chapter">&lt;</button><span id="fixed-chapter-number">01|08</span><button id="next-chapter-right" type="button" aria-label="Next chapter">&gt;</button></div></nav>
      <div id="story" tabindex="0" aria-label="Scroll here to progress through the eight chapters">
        <p class="loading-copy">Loading the eight chapters…</p>
      </div>
      <footer class="story-footer"><span id="chapter-position">01 / 08</span><span>Right panel / scroll to continue</span></footer>
    </section>
  </main>
  <template id="chapter-chart-template">
      <section id="change-chart" aria-label="Neighborhood funding change chart">
        <header class="chart-header"><h2>Losses and gains within each NTA</h2>
          <label>Show <select id="chart-view"><option value="overview">8 largest losses + 4 largest gains</option><option value="losses">Largest net losses</option><option value="gains">Largest net gains</option><option value="all">All NTAs</option></select></label>
          <p>FY2025 minus FY2024 · darker left = decreases · lighter right = increases · each segment = one recipient</p>
        </header>
        <div class="chart-axis"><span>NTA</span><div><span id="axis-loss"></span><span>0</span><span id="axis-gain"></span></div><span>Net change</span></div>
        <div id="chart-rows" tabindex="0" aria-label="Scrollable neighborhood rows"></div>
        <p id="chart-detail" role="status">Select a segment to inspect a recipient’s funding change.</p>
      </section>
  </template>
  <noscript>This story needs JavaScript to display the interactive map.</noscript>
  <script type="module" src="js/story.js"></script>
</body>
</html>
